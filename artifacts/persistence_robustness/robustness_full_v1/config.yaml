protocol_version: persistence_robustness_v1
analysis_role: behavioral_robustness_and_benchmark_expansion
model: Qwen/Qwen3.5-4B
output_root: artifacts/persistence_robustness
base_seed: 221026
split_seed: 222026
response_labels: [X, Y]

task_breadth:
  minimum_persistence_tasks: 8
  preferred_persistence_tasks: 10
  repaired_tasks: [voluntary_waiting, progressive_ratio, sunk_cost]
  extension_tasks: [voluntary_waiting, progressive_ratio, sunk_cost, controllability, debugging_persistence]

collection:
  # 512 recorded episodes = 256 semantic histories x 2 label mappings.
  recorded_episodes_per_task: 512
  pilot_semantic_pairs_per_cell: 2
  require_pilot_approval_for_full: true

tasks:
  voluntary_waiting:
    timing_environments: [moderate_early, moderate_late]
    reward_magnitudes: [8, 14]
    opportunity_costs: [1, 3]
    quit_payoffs: [0, 4]
    max_steps: 10

  progressive_ratio:
    ratio_schedules: [moderate_repair, sharp_repair]
    reward_magnitudes: [5, 11]
    effort_costs: [2, 6]
    outside_options: [2, 8]

  sunk_cost:
    prior_investments: [0, 4, 10]
    remaining_steps: [2, 4]
    reward_magnitudes: [7, 14]
    outside_options: [2, 6]
    step_costs: [2, 4]
    success_probabilities: [0.45, 0.75]

  controllability:
    exposure_types: [controllable, uncontrollable]
    exposure_trials: 10
    transfer_success_probabilities: [0.35, 0.7]
    transfer_costs: [1, 3]
    max_transfer_attempts: 8

  debugging_persistence:
    base_success_probabilities: [0.20, 0.45]
    clue_increments: [0.05, 0.15]
    attempt_costs: [1, 3]
    solution_rewards: [7, 14]
    restart_values: [0, 4]
    max_attempts: 8

matched_control:
  enabled: true
  semantic_pairs: 256
  pilot_semantic_pairs: 24
  conditions:
    reward_magnitudes: [6, 12]
    effort_costs: [1, 3]
    success_probabilities: [0.35, 0.7]
    outside_options: [0, 3]
    horizon: 8
  framings: [persistent_goal, independent_goals]
  versions: [absorbing_primary, advancing_secondary]

stretch:
  controllability_enabled: true
additional_tasks: [debugging_persistence]

pilot_adjustments:
  voluntary_waiting:
    - added moderate early/late hazard profiles with fewer first-step arrivals
    - crossed reward, wait cost, and quit payoff over a ten-step horizon
  progressive_ratio:
    - removed zero-cost cells and crossed materially costly work with outside options
    - shortened schedules while retaining moderate versus sharp effort growth
  sunk_cost:
    - expanded exact prospective matches across three prior-investment levels
    - clarified that past investment is irrecoverable and prospectively irrelevant
  controllability: []
  debugging_persistence: []

validation:
  persistence_probability_bounds: [0.05, 0.95]
  minimum_persistence_logit_sd: 0.15
  minimum_expected_probability_effect: 0.02
  minimum_median_episode_length: 2
  minimum_mapping_balance_correlation: 0.8
  maximum_mean_absolute_mapping_gap: 0.25
  minimum_top_token_action_rate: 0.90
  require_all_validity_checks: true

history_lags: [1, 2, 3, 5, 8]
history_decay: [0.0, 0.25, 0.5, 0.7, 0.85, 0.95]
latent_rho: [0.0, 0.25, 0.5, 0.7, 0.85, 0.95]
ridge_penalties: [0.01, 0.1, 1.0, 10.0]
hierarchical_deviation_penalty: 2.0
sharing: [task_specific, fully_shared, hierarchical]

primary_models:
  - intercept
  - immediate_state
  - finite_history
  - perseveration
  - exponential_reward
  - dual_history
  - dynamic_reevaluation
  - latent_commitment
  - flexible_linear
  - mlp

mlp:
  hidden_sizes: [32, 16]
  learning_rates: [0.001]
  dropout: [0.0]
  max_epochs: 120
  patience: 12

gru:
  hidden_sizes: [64, 128, 256, 512]
  layers: [1]
  optional_layers: [2]
  learning_rates: [0.0001, 0.0003, 0.001]
  weight_decay: [0.0, 0.00001, 0.0001]
  seeds: [0, 1, 2]
  input_variants: [current_state, short_history]
  maximum_epochs: 150
  patience: 15
  gradient_clip: 1.0
  episodes_per_task_per_batch: 4
  ceiling_epsilon: 0.005
  plateau_epsilon: 0.002

evaluation:
  task_macro: true
  within_task: true
  loto: true
  few_shot: true
  few_shot_counts: [0, 1, 4, 8, 16, 32]
  few_shot_models: [finite_history, dual_history, latent_commitment, flexible_linear]

task_balancing:
  balanced_minibatches: true

bootstrap:
  episode_samples: 2000
  task_samples: 5000

synthetic_recovery:
  repetitions: 100
  episodes_per_task: 120

inputs:
  comparative_config: config/comparative_persistence.yaml
  base_battery_run: artifacts/persistence_battery/battery_pilot_v1
  extension_dataset: full

task_specs:
  voluntary_waiting: {family: temporal_waiting, payoff_scale: 14.0, effort_scale: 30.0, horizon: 10, progress_scale: 1.0}
  progressive_ratio: {family: effort_expenditure, payoff_scale: 11.0, effort_scale: 126.0, horizon: 42, progress_scale: 1.0}
  sunk_cost: {family: investment_decision, payoff_scale: 14.0, effort_scale: 26.0, horizon: 4, progress_scale: 1.0}
  controllability: {family: controllability_transfer, payoff_scale: 8.0, effort_scale: 24.0, horizon: 8, progress_scale: 1.0}
  debugging_persistence: {family: debugging_repair, payoff_scale: 14.0, effort_scale: 24.0, horizon: 8, progress_scale: 1.0}

smoke:
  semantic_pairs_per_task: 3
  matched_semantic_pairs: 3
  maximum_episodes_per_task: 24
  ridge_penalties: [0.1, 1.0]
  models: [intercept, immediate_state, finite_history, dual_history, latent_commitment, flexible_linear]
  few_shot_counts: [0, 1]
  few_shot_models: [finite_history]
  mlp_hidden_sizes: [8]
  mlp_maximum_epochs: 3
  mlp_patience: 2
  gru_hidden_sizes: [8]
  gru_learning_rates: [0.001]
  gru_weight_decay: [0.0]
  gru_seeds: [0]
  gru_maximum_epochs: 3
  gru_patience: 2
  bootstrap_samples: 40
