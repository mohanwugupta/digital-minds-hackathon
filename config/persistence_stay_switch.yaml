protocol_version: persistence_stay_switch_v1
analysis_role: exploratory_shared_computation_pivot
model: Qwen/Qwen3.5-4B
seed: 101026
tasks: [bandit, foraging, solvability]
output_root: artifacts/persistence_stay_switch

paths:
  behavior_records: artifacts/computational_modeling/records
  model_zoo_output: artifacts/computational_modeling/model_zoo_mac_v2
  contrast_inventory: artifacts/persistence_discovery/contrast_inventory.csv
  bandit_factorial: artifacts/value_dissociation/factorial_shard_*.csv
  bandit_factorial_activations: artifacts/value_dissociation/activations
  activation_banks:
    bandit: artifacts/activation_bank
    foraging: artifacts/cross_task/track_b_shared_v3/foraging_activation_bank
    solvability: artifacts/cross_task/track_b_shared_v3/solvability_activation_bank
  control_banks:
    arbitrary_choice: artifacts/cross_task/track_b_shared_v3/control_activation_bank
    terminality: artifacts/cross_task/track_b_shared_v3/terminality_activation_bank
    generic_value: artifacts/persistence_discovery/generic_value_activation_bank

behavior:
  hazard_models:
    - task_specific
    - shared_history
    - shared_stay_switch
    - fully_shared
  history_lags: [1, 2, 3, 5]
  exponential_decay: [0.0, 0.25, 0.5, 0.7, 0.85, 0.95]
  ridge_grid: [0.01, 0.1, 1.0]
  calibration_bins: 10

gru:
  memory_ablations: true
  bottleneck_sizes: [1, 2, 4, 8, 16, 32, 64]
  history_windows: [1, 2, 3, 5]
  max_epochs: 100
  patience: 10
  ridge_grid: [0.01, 0.1, 1.0, 10.0]

neural:
  layers: all
  task_specific_readouts: true
  convergence_analysis: true
  projection_dimensions: 128
  ridge_grid: [0.01, 0.1, 1.0, 10.0, 100.0]

interventions:
  functional_profiles: true
  onset_fraction: 0.5

controls:
  arbitrary_choice: true
  generic_value: true
  terminality: true

bootstrap:
  development_samples: 2000
  final_samples: 10000

smoke:
  max_episodes_per_task_split: 10
  max_activation_states_per_task: 120
  projection_dimensions: 32
  gru_hidden_size: 8
  gru_bottleneck_sizes: [1, 4]
  gru_max_epochs: 6
  gru_patience: 3
  bootstrap_samples: 50
  max_intervention_pairs_per_group: 4
