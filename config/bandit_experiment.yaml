model:
  primary: Qwen/Qwen3.5-4B
  fallback: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  local_files_only: true

bandit:
  arm_probabilities: [0.20, 0.35, 0.50, 0.65]
  success_reward: 3
  failure_reward: -2
  stop_reward: 0
  # One-step expected values are [-1.00, -0.25, 0.50, 1.25].
  # These remain provisional until the behavioral pilot confirms overlap near STOP.
  design_status: pilot_locked_confirmatory_unfrozen
  max_decisions: 100

phases:
  pilot_episodes: 200
  # Research-sprint target; collection is resumable and can be extended later.
  probe_episodes: 512
  sequential_episodes_per_condition: 1000

probe:
  hidden_dim: 1024
  gamma: 1.0
  learning_rate: 0.0001
  weight_decay: 0.01
  top_fraction: 0.01
  split: [0.70, 0.15, 0.15]
  mechanism_diagnostic:
    split: test
    controls: [previous_outcome, loss_streak, log_round, log_round_squared]
    stronger_history_control: cumulative_score
    two_sided_alpha: 0.05
    minimum_incremental_r_squared: 0.01

intervention:
  alphas: [-1.0, 0.0, 1.0]
  calibration_candidates: [0.01, 0.025, 0.05, 0.1, 0.2]
  random_neuron_sets: 20
