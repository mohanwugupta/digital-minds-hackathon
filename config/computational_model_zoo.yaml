protocol_version: persistence_computational_model_zoo_v2
analysis_role: exploratory_model_discovery
model: Qwen/Qwen3.5-4B
seed: 95026
neural_linear_recovery_tolerance_r2: 0.02

tasks: [bandit, foraging, solvability]
records_output: artifacts/computational_modeling/records
output_root: artifacts/computational_modeling

data:
  bandit:
    activation_bank: artifacts/activation_bank
    split: artifacts/value_probes/episode_split.json
  foraging:
    activation_bank: artifacts/cross_task/track_b_shared_v3/foraging_activation_bank
    split: artifacts/cross_task/track_b_shared_v3/foraging_episode_split.json
  solvability:
    activation_bank: artifacts/cross_task/track_b_shared_v3/solvability_activation_bank
    split: artifacts/cross_task/track_b_shared_v3/solvability_episode_split.json

targets:
  primary: persistence_logit
  secondary: sampled_continue

information_sets:
  primary: observable
  secondary: [oracle]

weighting:
  episode_balanced: true
  task_balanced: true

sharing:
  architectures:
    - task_specific
    - shared_architecture_task_observation
    - fully_shared

models:
  intercept: true
  time: true
  previous_outcome: true
  streak: true
  choice_inertia: true
  finite_history: true
  rescorla_wagner: true
  bayesian: true
  value_history_hybrid: true
  termination_advantage: true
  sticky_termination: true
  decomposed_meta_control: true
  mvt_like_foraging_threshold: true
  disengagement_accumulator: true
  latent_commitment: true
  generic_latent_value: true
  flexible_linear: true
  mlp: true
  gru: true

finite_history:
  lags: [1, 2, 3, 5]

learning:
  rw_alphas: [0.05, 0.1, 0.2, 0.35, 0.5, 0.7, 0.9]

dynamics:
  decays: [0.0, 0.25, 0.5, 0.7, 0.85, 0.95]
  rho_grid: [0.0, 0.25, 0.5, 0.7, 0.85, 0.95]

mlp:
  learning_rates: [0.001, 0.0003]
  dropout: [0.0, 0.1]
  max_epochs: 100
  early_stopping_patience: 10

gru:
  hidden_sizes: [32, 64]
  learning_rates: [0.001, 0.0003]
  dropout: [0.0, 0.1]
  max_epochs: 100
  early_stopping_patience: 10

neural_sanity:
  feature_count: 8
  decisions: 8
  episodes_per_task:
    train: 48
    validation: 16
    test: 16
  noise_sd: 0.03
  learning_rate: 0.001
  gru_hidden_size: 16
  max_epochs: 80
  early_stopping_patience: 12

bootstrap:
  development_samples: 2000
  final_samples: 10000

model_recovery:
  enabled: true
  repetitions: 20
  episodes: 48
  decisions: 10
