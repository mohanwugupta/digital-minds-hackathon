[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-steering-bandit"
version = "0.1.0"
description = "Causal value-steering and task-persistence experiment"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["analysis*", "bandit*", "experiments*", "interventions*", "models*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
